name: CI

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify dependencies
        run: go mod verify

      - name: Build
        run: go build ./...

      - name: Test with coverage
        run: |
          # Measure coverage only for business logic — exclude generated code, infra, and entry points.
          COVERPKGS=$(go list ./internal/... | grep -v -E '/db/generated$|/store$' | tr '\n' ',' | sed 's/,$//')
          go test -race -timeout 120s \
            -coverprofile=coverage.out \
            -covermode=atomic \
            -coverpkg="${COVERPKGS}" \
            ./...

      - name: Enforce 80% coverage threshold
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | awk '/^total:/{gsub(/%/,"",$3); print $3}')
          echo "Coverage: ${COVERAGE}%"
          awk "BEGIN{ if (${COVERAGE}+0 < 80) { print \"FAIL: \" ${COVERAGE} \"% is below the 80% threshold — write tests for uncovered code\"; exit 1 } }"

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage.out
          retention-days: 7

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest

      - name: Run golangci-lint
        run: golangci-lint run ./...
