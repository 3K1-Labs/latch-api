name: latch-backend

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: apply pending migrations, then exit. The app waits for this to
  # succeed, so a fresh `make docker-up` comes up against a migrated schema.
  migrate:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: ["go", "run", "./cmd/migrate", "up"]
    restart: "no"
    volumes:
      - .:/app
      - go_mod_cache:/root/go/pkg/mod
      - go_build_cache:/root/.cache/go-build
    env_file: .env
    environment:
      DATABASE_URL: postgres://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  # Development server with air live-reload.
  # Mount the full source tree so air can watch and rebuild on the fly.
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    volumes:
      - .:/app                            # source code (watched by air)
      - go_mod_cache:/root/go/pkg/mod     # cache modules between restarts
      - go_build_cache:/root/.cache/go-build  # cache compiled packages (air rebuilds often)
    ports:
      - "${PORT}:8080"
    env_file: .env
    environment:
      # Override hosts to use Docker service names instead of localhost.
      # In-network ports are fixed (5432/6379/8080) regardless of which host
      # ports .env publishes them on.
      DB_HOST: postgres
      REDIS_HOST: redis
      PORT: "8080"
      DATABASE_URL: postgres://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}?sslmode=disable
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      - app

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  postgres_data:
  redis_data:
  go_mod_cache:
  go_build_cache:
  grafana_data:
