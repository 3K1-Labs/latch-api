basePath: /
definitions:
  github_com_latch_backend_internal_service.PushRegistration:
    properties:
      blind_signer_id:
        type: string
      queue_index:
        type: string
    type: object
  github_com_latch_backend_internal_service.RPCResourceConfig:
    properties:
      instructionLeeway:
        type: integer
    type: object
  github_com_latch_backend_internal_service.RestorePreamble:
    properties:
      minResourceFee:
        type: string
      transactionData:
        description: base64 XDR SorobanTransactionData for the restore tx
        type: string
    type: object
  github_com_latch_backend_internal_service.SimResultEntry:
    properties:
      auth:
        description: base64 XDR SorobanAuthorizationEntry values
        items:
          type: string
        type: array
      xdr:
        description: base64 XDR return value (ScVal)
        type: string
    type: object
  internal_handler.addSignatureRequest:
    properties:
      auth_entry_xdr:
        type: string
      blind_signer_id:
        type: string
    required:
    - auth_entry_xdr
    - blind_signer_id
    type: object
  internal_handler.announceMembershipRequest:
    properties:
      member_blind_ids:
        items:
          type: string
        type: array
      wallet_ref:
        type: string
    required:
    - member_blind_ids
    - wallet_ref
    type: object
  internal_handler.apiErrorBody:
    properties:
      code:
        example: INTERNAL_ERROR
        type: string
      message:
        example: internal error
        type: string
    type: object
  internal_handler.apiErrorResponse:
    properties:
      error:
        $ref: '#/definitions/internal_handler.apiErrorBody'
    type: object
  internal_handler.backupExistsDataResponse:
    properties:
      data:
        $ref: '#/definitions/internal_handler.backupExistsResponse'
    type: object
  internal_handler.backupExistsResponse:
    properties:
      exists:
        example: true
        type: boolean
    type: object
  internal_handler.blobDataResponse:
    properties:
      data:
        $ref: '#/definitions/internal_handler.encryptedBlobResponse'
    type: object
  internal_handler.clientEncryptedBlob:
    properties:
      authTag:
        type: string
      ciphertext:
        type: string
      iv:
        type: string
      salt:
        type: string
      version:
        type: string
    type: object
  internal_handler.createCosignRequest:
    properties:
      network:
        type: string
      queue_index:
        type: string
      threshold:
        minimum: 1
        type: integer
      unsigned_tx_xdr:
        type: string
    required:
    - network
    - queue_index
    - threshold
    - unsigned_tx_xdr
    type: object
  internal_handler.encryptedBlobResponse:
    properties:
      encrypted_blob:
        $ref: '#/definitions/internal_handler.clientEncryptedBlob'
    type: object
  internal_handler.historyDataInner:
    properties:
      network:
        example: testnet
        type: string
      transactions:
        items:
          additionalProperties: {}
          type: object
        type: array
    type: object
  internal_handler.historyDataResponse:
    properties:
      data:
        $ref: '#/definitions/internal_handler.historyDataInner'
    type: object
  internal_handler.initiateRecoveryRequest:
    properties:
      email:
        example: user@example.com
        type: string
    required:
    - email
    type: object
  internal_handler.logoutRequest:
    properties:
      refresh_token:
        type: string
    required:
    - refresh_token
    type: object
  internal_handler.markSubmittedRequest:
    properties:
      tx_hash:
        type: string
    required:
    - tx_hash
    type: object
  internal_handler.messageDataResponse:
    properties:
      data:
        $ref: '#/definitions/internal_handler.messageResponse'
    type: object
  internal_handler.messageResponse:
    properties:
      message:
        example: OTP sent
        type: string
    type: object
  internal_handler.pricesDataResponse:
    properties:
      data:
        additionalProperties:
          format: float64
          type: number
        type: object
    type: object
  internal_handler.recoveryTokenDataResponse:
    properties:
      data:
        $ref: '#/definitions/internal_handler.recoveryTokenResponse'
    type: object
  internal_handler.recoveryTokenResponse:
    properties:
      expires_in:
        example: 900
        type: integer
      recovery_token:
        type: string
    type: object
  internal_handler.refreshRequest:
    properties:
      refresh_token:
        type: string
    required:
    - refresh_token
    type: object
  internal_handler.registerPushTokenRequest:
    properties:
      push_token:
        type: string
      registrations:
        items:
          $ref: '#/definitions/github_com_latch_backend_internal_service.PushRegistration'
        type: array
    required:
    - push_token
    - registrations
    type: object
  internal_handler.registerRequest:
    properties:
      email:
        example: user@example.com
        type: string
    required:
    - email
    type: object
  internal_handler.relayRequest:
    properties:
      network:
        type: string
      xdr:
        type: string
    required:
    - xdr
    type: object
  internal_handler.relayResponse:
    properties:
      error:
        type: string
      hash:
        type: string
      status:
        type: string
    type: object
  internal_handler.simulateDataResponse:
    properties:
      data:
        $ref: '#/definitions/internal_handler.simulateResponse'
    type: object
  internal_handler.simulateRequest:
    properties:
      network:
        type: string
      resourceConfig:
        $ref: '#/definitions/github_com_latch_backend_internal_service.RPCResourceConfig'
      xdr:
        type: string
    required:
    - xdr
    type: object
  internal_handler.simulateResponse:
    properties:
      error:
        type: string
      events:
        items:
          type: string
        type: array
      latest_ledger:
        type: integer
      min_resource_fee:
        type: string
      restore_preamble:
        $ref: '#/definitions/github_com_latch_backend_internal_service.RestorePreamble'
      results:
        items:
          $ref: '#/definitions/github_com_latch_backend_internal_service.SimResultEntry'
        type: array
      transaction_data:
        type: string
    type: object
  internal_handler.storeBackupRequest:
    properties:
      encrypted_blob:
        $ref: '#/definitions/internal_handler.clientEncryptedBlob'
      smart_account_address:
        type: string
    required:
    - smart_account_address
    type: object
  internal_handler.storeWCKBundleRequest:
    properties:
      bundle:
        type: string
    required:
    - bundle
    type: object
  internal_handler.tokenDataResponse:
    properties:
      data:
        $ref: '#/definitions/internal_handler.tokenResponse'
    type: object
  internal_handler.tokenResponse:
    properties:
      access_token:
        type: string
      expires_in:
        example: 900
        type: integer
      refresh_token:
        type: string
    type: object
  internal_handler.verifyRecoveryRequest:
    properties:
      email:
        example: user@example.com
        type: string
      otp:
        example: "123456"
        type: string
    required:
    - email
    - otp
    type: object
  internal_handler.verifyRequest:
    properties:
      email:
        example: user@example.com
        type: string
      otp:
        example: "123456"
        type: string
    required:
    - email
    - otp
    type: object
  internal_handler.walletChallengeRequest:
    properties:
      key_type:
        type: string
      wallet:
        type: string
    required:
    - key_type
    - wallet
    type: object
  internal_handler.walletSignInRequest:
    properties:
      authenticator_data:
        description: Passkey (WebAuthn) assertion fields — all standard base64.
        type: string
      client_data_json:
        type: string
      key_type:
        type: string
      nonce:
        type: string
      passkey_signature:
        description: ASN.1 DER P-256 signature
        type: string
      signature:
        description: base64 ed25519 signature over the raw nonce bytes
        type: string
      wallet:
        type: string
    required:
    - key_type
    - nonce
    - wallet
    type: object
  internal_handler_webapp.backupPasskeyRequest:
    properties:
      label:
        example: my phone
        type: string
      smartAccountAddress:
        example: CABC...XYZ
        type: string
    required:
    - smartAccountAddress
    type: object
  internal_handler_webapp.backupPasskeyResponse:
    properties:
      next:
        example: Call /api/webauthn/registration/* to register a second passkey, then
          attach it on-chain in a future step.
        type: string
      ok:
        example: true
        type: boolean
    type: object
  internal_handler_webapp.counterResponse:
    properties:
      value:
        example: 7
        type: integer
    type: object
  internal_handler_webapp.createOnRampSessionRequest:
    properties:
      destinationCAddress:
        example: CABC...XYZ
        type: string
      fiatAmount:
        example: "25"
        type: string
      fiatCode:
        example: USD
        type: string
    required:
    - destinationCAddress
    type: object
  internal_handler_webapp.createSignPayloadRequest:
    properties:
      callback:
        example: https://example.com/callback
        type: string
      network:
        example: testnet
        type: string
      origin:
        example: https://example.com
        type: string
      requestId:
        example: req-123
        type: string
      smartAccountAddress:
        example: CABC...XYZ
        type: string
      submit:
        example: true
        type: boolean
      ttlSeconds:
        example: 600
        type: integer
      unsignedTxXdr:
        example: AAAAAgAAAAA...
        type: string
    required:
    - callback
    - network
    - smartAccountAddress
    - unsignedTxXdr
    type: object
  internal_handler_webapp.createSignPayloadResponse:
    properties:
      expiresAt:
        example: "2026-07-02T12:10:00Z"
        type: string
      payloadRef:
        example: sp_1a2b3c4d5e6f7890abcdef1234567890
        type: string
    type: object
  internal_handler_webapp.onRampIntentResponse:
    properties:
      createdAt:
        example: "2026-07-02T12:00:00Z"
        type: string
      destinationCAddress:
        example: CABC...XYZ
        type: string
      fiatAmount:
        example: "25"
        type: string
      fiatCode:
        example: USD
        type: string
      id:
        example: 9c1e1c1a-2b3d-4e5f-8a9b-0c1d2e3f4a5b
        type: string
      memoId:
        example: "1234567890"
        type: string
      moonpayTransactionId:
        example: tx_abc123
        type: string
      moonpayTransactionStatus:
        example: completed
        type: string
      status:
        enum:
        - created
        - pending
        - completed
        - failed
        example: pending
        type: string
      updatedAt:
        example: "2026-07-02T12:05:00Z"
        type: string
    type: object
  internal_handler_webapp.onRampPoolResponse:
    properties:
      network:
        example: testnet
        type: string
      poolAddress:
        example: GPOOL...XYZ
        type: string
      recentTransactions:
        items:
          $ref: '#/definitions/internal_handler_webapp.onRampPoolTransactionResponse'
        type: array
      xlmBalance:
        example: "1234.5000000"
        type: string
    type: object
  internal_handler_webapp.onRampPoolTransactionResponse:
    properties:
      createdAt:
        example: "2026-07-02T12:00:00Z"
        type: string
      memo:
        example: "1234567890"
        type: string
      memoType:
        example: text
        type: string
      successful:
        example: true
        type: boolean
      transactionId:
        example: a1b2c3...
        type: string
    type: object
  internal_handler_webapp.onRampSessionResponse:
    properties:
      destinationCAddress:
        example: CABC...XYZ
        type: string
      fiatAmount:
        example: "25"
        type: string
      fiatCode:
        example: USD
        type: string
      integrationMode:
        enum:
        - widget
        - platform
        example: widget
        type: string
      intentId:
        example: 9c1e1c1a-2b3d-4e5f-8a9b-0c1d2e3f4a5b
        type: string
      memoId:
        example: "1234567890"
        type: string
      platformFallback:
        example: true
        type: boolean
      poolAddress:
        example: GPOOL...XYZ
        type: string
      sessionToken:
        example: eyJhbGciOi...
        type: string
      widgetUrl:
        example: https://buy.moonpay.com?apiKey=...&signature=...
        type: string
    type: object
  internal_handler_webapp.updateOnRampIntentRequest:
    properties:
      moonpayTransactionId:
        example: tx_abc123
        type: string
      status:
        enum:
        - created
        - pending
        - completed
        - failed
        example: pending
        type: string
    type: object
  internal_handler_webapp.webappErrorResponse:
    properties:
      code:
        example: internal_error
        type: string
      error:
        example: internal error
        type: string
      message:
        example: internal error
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: Stellar wallet backend — auth, encrypted credential backup, and account
    recovery.
  title: Latch API
  version: "1.0"
paths:
  /api/counter:
    get:
      description: Simulates the demo counter contract's get() function on testnet.
        Returns 0 if the simulation doesn't return a success result (e.g. an unset
        counter).
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handler_webapp.counterResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_handler_webapp.webappErrorResponse'
      summary: Get the demo counter value
      tags:
      - counter
  /api/on-ramp/intent/{id}:
    get:
      description: Dev-only (403 in production). Fetches an on-ramp intent by id,
        including its live MoonPay transaction status if one is attached.
      parameters:
      - description: On-ramp intent ID (UUID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handler_webapp.onRampIntentResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/internal_handler_webapp.webappErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_handler_webapp.webappErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_handler_webapp.webappErrorResponse'
      summary: Get an on-ramp intent
      tags:
      - on-ramp
    patch:
      consumes:
      - application/json
      description: 'Dev-only (403 in production). Partial update: at least one of
        status or moonpayTransactionId is required. Returns the updated intent with
        its live MoonPay transaction status.'
      parameters:
      - description: On-ramp intent ID (UUID)
        in: path
        name: id
        required: true
        type: string
      - description: Fields to update
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_handler_webapp.updateOnRampIntentRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handler_webapp.onRampIntentResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_handler_webapp.webappErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/internal_handler_webapp.webappErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_handler_webapp.webappErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_handler_webapp.webappErrorResponse'
      summary: Update an on-ramp intent
      tags:
      - on-ramp
  /api/on-ramp/pool:
    get:
      description: Dev-only (403 in production). Returns the on-ramp pool account's
        XLM balance and up to 20 recent transactions, optionally filtered to a single
        memo.
      parameters:
      - description: Filter recent transactions to this memo (e.g. an intent's memoId)
        in: query
        name: memo
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handler_webapp.onRampPoolResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/internal_handler_webapp.webappErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_handler_webapp.webappErrorResponse'
      summary: Get the on-ramp pool account snapshot
      tags:
      - on-ramp
  /api/on-ramp/session:
    post:
      consumes:
      - application/json
      description: Dev-only (403 in production). Creates a MoonPay on-ramp intent
        for destinationCAddress and returns either a Platform API session token or
        a signed widget URL depending on MOONPAY_INTEGRATION_MODE ("auto" falls back
        to a widget URL if the Platform API returns 404).
      parameters:
      - description: Destination contract address and optional fiat amount/code
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_handler_webapp.createOnRampSessionRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handler_webapp.onRampSessionResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_handler_webapp.webappErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/internal_handler_webapp.webappErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_handler_webapp.webappErrorResponse'
        "502":
          description: Bad Gateway
          schema:
            $ref: '#/definitions/internal_handler_webapp.webappErrorResponse'
      summary: Create an on-ramp session
      tags:
      - on-ramp
  /api/recovery/backup-passkey:
    post:
      consumes:
      - application/json
      description: Verifies the session user owns smartAccountAddress, then records
        (upserts) intent to add a backup passkey signer. Today this only stores metadata;
        a future step wires it to an on-chain second-signer flow. The session cookie
        is set automatically if missing.
      parameters:
      - description: Smart account address and optional label
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_handler_webapp.backupPasskeyRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handler_webapp.backupPasskeyResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_handler_webapp.webappErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_handler_webapp.webappErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_handler_webapp.webappErrorResponse'
      summary: Record intent to add a backup passkey signer
      tags:
      - recovery
  /api/sign-payload:
    post:
      consumes:
      - application/json
      description: 'Stores an unsigned transaction XDR plus a callback URL under a
        single-use, TTL-bounded reference (60s-3600s, default 600s). The referenced
        payload is deleted-on-read: GET consumes it exactly once. callback must be
        https://, or http://localhost / http://127.0.0.1 for local development.'
      parameters:
      - description: Sign payload to store
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_handler_webapp.createSignPayloadRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/internal_handler_webapp.createSignPayloadResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_handler_webapp.webappErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_handler_webapp.webappErrorResponse'
      summary: Store a sign payload for out-of-band signing
      tags:
      - sign-payload
  /api/sign-payload/{payloadRef}:
    get:
      description: Fetches and permanently consumes (single-use) the sign payload
        for payloadRef. Returns 404 if the reference never existed or was already
        consumed, 410 if it expired.
      parameters:
      - description: Payload reference, e.g. sp_1a2b3c4d5e6f7890abcdef1234567890
        in: path
        name: payloadRef
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handler_webapp.createSignPayloadRequest'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_handler_webapp.webappErrorResponse'
        "410":
          description: Gone
          schema:
            $ref: '#/definitions/internal_handler_webapp.webappErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_handler_webapp.webappErrorResponse'
      summary: Consume a stored sign payload
      tags:
      - sign-payload
  /api/transaction/relay:
    post:
      consumes:
      - application/json
      description: Submits a signed transaction envelope to the Soroban RPC, polls
        for confirmation (up to 20 s), and returns the final status.
      parameters:
      - description: Signed XDR transaction envelope and optional network
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_handler.relayRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handler.relayResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_handler.apiErrorResponse'
        "502":
          description: Bad Gateway
          schema:
            $ref: '#/definitions/internal_handler.apiErrorResponse'
      summary: Submit and confirm a Soroban transaction
      tags:
      - transaction
  /api/transaction/simulate:
    post:
      consumes:
      - application/json
      description: Simulates a Soroban transaction via the RPC and returns min resource
        fee, transaction data, and results.
      parameters:
      - description: XDR-encoded transaction envelope and optional network
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_handler.simulateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handler.simulateDataResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_handler.apiErrorResponse'
        "422":
          description: Simulation returned an error from the RPC
          schema:
            $ref: '#/definitions/internal_handler.simulateDataResponse'
        "502":
          description: Bad Gateway
          schema:
            $ref: '#/definitions/internal_handler.apiErrorResponse'
      summary: Simulate Soroban transaction
      tags:
      - transaction
  /v1/auth/challenge:
    post:
      consumes:
      - application/json
      parameters:
      - description: Wallet address + key_type
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_handler.walletChallengeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_handler.apiErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_handler.apiErrorResponse'
      summary: Request a wallet sign-in challenge
      tags:
      - auth
  /v1/auth/logout:
    post:
      consumes:
      - application/json
      description: Revokes the provided refresh token. Requires a valid access token.
      parameters:
      - description: Refresh token to revoke
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_handler.logoutRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handler.messageDataResponse'
        "400":
