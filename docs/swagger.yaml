host: localhost:8080
info:
  contact: {}
  description: Stellar wallet backend — auth, encrypted credential backup, and account
    recovery.
  title: Latch API
  version: "1.0"
paths:
  /api/accounts:
    get:
      description: Returns every smart account (seed and passkey wallets) owned by
        the session user.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_handler_webapp.webappErrorResponse'
      summary: List the session user's smart accounts
      tags:
      - accounts
  /api/accounts/set-active:
    post:
      consumes:
      - application/json
      description: Sets a client-readable cookie recording which smart account is
        active. Purely a cookie write — no server-side persistence.
      parameters:
      - description: Smart account address to mark active
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_handler_webapp.setActiveAccountRequest'
