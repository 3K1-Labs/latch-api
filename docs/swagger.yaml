        name: token
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handler.messageDataResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_handler.apiErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_handler.apiErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_handler.apiErrorResponse'
      security:
      - BearerAuth: []
      summary: Remove all registrations for a push token (logout hygiene)
      tags:
      - push-tokens
  /v1/recovery/blob:
    get:
      description: |-
        Returns the opaque client-encrypted blob. The mobile client decrypts it
        locally using the recovery password. Requires a recovery-scoped JWT.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handler.blobDataResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_handler.apiErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_handler.apiErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_handler.apiErrorResponse'
      security:
      - RecoveryAuth: []
      summary: Fetch encrypted credential blob
      tags:
      - recovery
  /v1/recovery/initiate:
    post:
      consumes:
      - application/json
      description: Sends a recovery OTP to the email if a verified account exists.
        Always returns 200 to prevent enumeration.
      parameters:
      - description: Email address
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_handler.initiateRecoveryRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handler.messageDataResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_handler.apiErrorResponse'
      summary: Initiate account recovery
      tags:
      - recovery
  /v1/recovery/verify:
    post:
      consumes:
      - application/json
      description: Verifies the recovery OTP and returns a short-lived recovery-scoped
        JWT.
      parameters:
      - description: Email and OTP
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_handler.verifyRecoveryRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handler.recoveryTokenDataResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_handler.apiErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_handler.apiErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_handler.apiErrorResponse'
      summary: Verify recovery OTP
      tags:
      - recovery
  /v1/wck-bundles/{pickup_key}:
    get:
      parameters:
      - description: Pickup key (hex64)
        in: path
        name: pickup_key
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_handler.apiErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_handler.apiErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_handler.apiErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_handler.apiErrorResponse'
      security:
      - BearerAuth: []
      summary: Fetch the sealed WCK bundle for a pickup key
      tags:
      - wck-bundles
    put:
      consumes:
      - application/json
      parameters:
      - description: Pickup key (hex64, derived from the wallet C-address)
        in: path
        name: pickup_key
        required: true
        type: string
      - description: Sealed bundle (server-opaque)
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_handler.storeWCKBundleRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_handler.apiErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_handler.apiErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/internal_handler.apiErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_handler.apiErrorResponse'
      security:
      - BearerAuth: []
      summary: Upload a sealed WCK bundle for member pickup
      tags:
      - wck-bundles
securityDefinitions:
  BearerAuth:
    description: 'Enter: Bearer <access_token>'
    in: header
    name: Authorization
    type: apiKey
  RecoveryAuth:
    description: 'Enter: Bearer <recovery_token>  (obtained from POST /v1/recovery/verify)'
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
