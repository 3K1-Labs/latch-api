            $ref: '#/definitions/internal_handler.apiErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_handler.apiErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_handler.apiErrorResponse'
      security:
      - BearerAuth: []
      summary: Store client-encrypted backup
      tags:
      - backup
    put:
      consumes:
      - application/json
      description: |-
        Stores an opaque credential blob that the mobile client has already encrypted
        with Argon2id + AES-256-GCM. The backend never decrypts it.
        POST and PUT are identical — both upsert.
      parameters:
      - description: Client-encrypted blob and smart account address
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_handler.storeBackupRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/internal_handler.messageDataResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_handler.apiErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_handler.apiErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_handler.apiErrorResponse'
      security:
      - BearerAuth: []
      summary: Store client-encrypted backup
      tags:
      - backup
