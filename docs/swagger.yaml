securityDefinitions:
  BearerAuth:
    description: 'Enter: Bearer <access_token>'
    in: header
    name: Authorization
    type: apiKey
  RecoveryAuth:
    description: 'Enter: Bearer <recovery_token>  (obtained from POST /v1/recovery/verify)'
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
