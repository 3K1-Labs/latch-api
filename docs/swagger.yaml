      description: |-
        Stores an opaque credential blob that the mobile client has already encrypted
        with Argon2id + AES-256-GCM. The backend never decrypts it.
        POST and PUT are identical — both upsert.
      parameters:
      - description: Client-encrypted blob and smart account address
        in: body
        name: body
        required: true
