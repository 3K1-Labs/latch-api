version: "2"
sql:
  - engine: "postgresql"
    queries: "internal/db/queries"
    schema:
      - "migrations/000001_create_users.up.sql"
      - "migrations/000002_create_credential_backups.up.sql"
      - "migrations/000003_create_user_encryption_keys.up.sql"
      - "migrations/000004_create_refresh_tokens.up.sql"
      - "migrations/000005_create_audit_log.up.sql"
      - "migrations/000006_unique_refresh_token_hash.up.sql"
      - "migrations/000007_client_encrypted_backup.up.sql"
      - "migrations/000008_create_cosign_requests.up.sql"
      - "migrations/000009_cosign_blind_index.up.sql"
      - "migrations/000010_wallet_refresh_tokens.up.sql"
      - "migrations/000011_wck_bundles_push_tokens.up.sql"
      - "migrations/000012_wck_bundle_uploader.up.sql"
      - "migrations/000013_wallet_memberships.up.sql"
      - "migrations/000014_webapp_schema_init.up.sql"
      - "migrations/000015_webapp_multisig_service.up.sql"
      - "migrations/000016_webapp_multisig_draft.up.sql"
      - "migrations/000017_webapp_sign_payloads.up.sql"
      - "migrations/000018_webapp_on_ramp_intents.up.sql"
      - "migrations/000019_webapp_multisig_member_sessions.up.sql"
      - "migrations/000020_add_memo_registration.up.sql"
      - "migrations/000021_smart_account_registrations.up.sql"
      - "migrations/000023_smart_account_registrations_ownership_only.up.sql"
    gen:
      go:
        package: "db"
        out: "internal/db/generated"
        emit_json_tags: true
        emit_interface: true
        overrides:
          - db_type: "uuid"
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
          - db_type: "timestamptz"
            go_type: "time.Time"
          - column: "credential_backups.encryption_version"
            go_type: "int32"
          - column: "smart_account_registrations.smart_account_address"
            go_type: "string"
