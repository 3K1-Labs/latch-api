version: "2"
sql:
  - engine: "postgresql"
    queries: "internal/db/queries"
    schema:
      - "migrations/000001_create_users.up.sql"
      - "migrations/000002_create_credential_backups.up.sql"
      - "migrations/000003_create_user_encryption_keys.up.sql"
      - "migrations/000004_create_refresh_tokens.up.sql"
      - "migrations/000005_create_audit_log.up.sql"
      - "migrations/000006_unique_refresh_token_hash.up.sql"
      - "migrations/000007_client_encrypted_backup.up.sql"
      - "migrations/000008_create_cosign_requests.up.sql"
    gen:
      go:
        package: "db"
        out: "internal/db/generated"
        emit_json_tags: true
        emit_interface: true
        overrides:
          - db_type: "uuid"
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
          - db_type: "timestamptz"
            go_type: "time.Time"
          - column: "credential_backups.encryption_version"
            go_type: "int32"
          - column: "credential_backups.smart_account_address"
            go_type: "string"
